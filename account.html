<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexas — Account</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="account" data-chrome="app" data-back="index.html" data-title="Account">
<div class="app">
  <main>
    <div class="shell">
      <div class="summary" style="display:flex;align-items:center;gap:14px">
        <div class="avatar" style="width:52px;height:52px;font-size:22px">A</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:16px">Amara Kimani</div>
          <div style="color:var(--muted);font-size:12.5px">am***a@mail.com</div>
        </div>
        <span class="badge warn">Unverified</span>
      </div>

      <div class="list">
        <button class="row" data-open="profile">
          <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M7 10h3M7 14h6M15 9h3v4h-3z"></path></svg></span>
          <span class="t"><b>Change name</b><span>Amara Kimani</span></span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
        </button>
        <button class="row" data-open="password">
          <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 118 0v4"></path></svg></span>
          <span class="t"><b>Update password</b><span>Last changed 4 months ago</span></span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
        </button>
        <button class="row" data-open="verify">
          <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg></span>
          <span class="t"><b>Verify identity</b><span>Required before your first withdrawal</span></span>
          <span class="badge warn">2 steps left</span>
        </button>
      </div>

      <div class="list">
        <a class="row danger" href="login.html">
          <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path><path d="M16 17l5-5-5-5M21 12H9"></path></svg></span>
          <span class="t"><b>Log out</b></span>
        </a>
      </div>
      <div style="height:24px"></div>
    </div>
  </main>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/net.js"></script>
<script src="assets/js/format.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/modals.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
