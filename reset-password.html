<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>/* Before the first paint: app.js runs at the end of the body, and until
   it does every page renders in the default light palette and then flips.
   On a multi-page app that flip happens on every single navigation, which
   is the flicker. Four lines here, ahead of the stylesheet, cost nothing
   and remove it. */
try{document.documentElement.setAttribute('data-theme',localStorage.getItem('nexas.theme')||'dark')}
catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>

<meta property="og:site_name" content="Novi">

<meta property="og:description" content="Trade digit contracts on synthetic indices. M-Pesa and card, in your own currency.">

<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/app.css">

<body data-page="login" data-chrome="auth">
<div class="app">
  <main>
    <div class="auth">
      <div class="auth-head">
        <a class="iconbtn back-btn auth-back" href="landing" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 18l-6-6 6-6"></path></svg></a>
        <a class="wordmark" href="forgot-password">Novi</a>
        <h1>Choose a new password.</h1>
        <p>We sent a code to am***a@mail.com. It expires in 15 minutes.</p>
      </div>

      <div class="auth-card">
        <form data-splash="Updating your password" data-auth="reset" data-to="login" style="display:flex;flex-direction:column;gap:18px">
          <div class="field">
            <label>Verification code</label>
            <div class="otp">
              <input inputmode="numeric" maxlength="1" aria-label="Digit 1">
              <input inputmode="numeric" maxlength="1" aria-label="Digit 2">
              <input inputmode="numeric" maxlength="1" aria-label="Digit 3">
              <input inputmode="numeric" maxlength="1" aria-label="Digit 4">
              <input inputmode="numeric" maxlength="1" aria-label="Digit 5">
              <input inputmode="numeric" maxlength="1" aria-label="Digit 6">
            </div>
            <span class="hint">Didn't arrive? <a class="link" href="#">Send again in 0:42</a></span>
          </div>

          <div class="field">
            <label for="newPassword">New password</label>
            <div class="input-wrap">
              <input class="input" id="newPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters">
              <button type="button" data-reveal aria-label="Show password">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"></path><circle cx="12" cy="12" r="2.6"></circle></svg>
              </button>
            </div>
            <div class="meter"><i></i><i></i><i></i><i></i></div>
          </div>

          <div class="field">
            <label for="confirmNew">Confirm password</label>
            <input class="input" id="confirmNew" type="password" autocomplete="new-password" placeholder="Repeat new password">
          </div>

          <button class="btn btn-fill" type="submit">Set new password</button>
        </form>
      </div>

      <div class="auth-foot">Back to <a href="login">sign in</a></div>
    </div>
  </main>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/net.js"></script>
<script src="assets/js/format.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/modals.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
