<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexas — Terminal</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A1420">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="trade" data-chrome="app">
<div class="app">
  <main>
    <div class="terminal" id="terminal">

      <div class="col-mid">
        <div class="ctabs" id="contractTabs"><div class="sk sk-tabs"></div></div>
        <div class="instrument" id="instrument"><div class="sk sk-inst"></div></div>

        <div class="chart-card">
          <canvas id="chart" aria-label="Price chart"></canvas>
          <div class="chart-tools">
            <button data-zoom="in" aria-label="Zoom in">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
            <button data-zoom="reset" aria-label="Reset zoom">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 12a9 9 0 109-9"></path><path d="M3 4v5h5"></path></svg>
            </button>
            <button data-zoom="out" aria-label="Zoom out">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h14"></path></svg>
            </button>
          </div>
          <div class="chart-opts" id="chartOpts">
            <button data-view="line" class="active">Ticks</button>
            <button data-view="5">5t</button>
            <button data-view="15">15t</button>
          </div>
        </div>

        <div class="digits" id="digits"></div>
        <div id="activeList"></div>
      </div>

      <div class="col-right">
        <div class="panel" id="panel"><div class="sk sk-panel"></div></div>
        <div class="trade-dock" id="dock"></div>
      </div>

    </div>
  </main>
</div>
<script src="assets/js/format.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/chart.js"></script>
<script src="assets/js/modals.js"></script>
<script src="assets/js/trade.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
