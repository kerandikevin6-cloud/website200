<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexas — Create Account</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="signup" data-chrome="auth">
<div class="app">
  <main>
    <div class="auth">
      <div class="auth-head">
        <a class="wordmark" href="index.html">Nexas</a>
        <h1>Open your account.</h1>
        <p>Two minutes to set up. Deposit when you are ready.</p>
      </div>

      <div class="auth-card">
        <form data-splash="Setting up your account" style="display:flex;flex-direction:column;gap:16px">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="field">
              <label for="sFirst">First name</label>
              <input class="input" id="sFirst" autocomplete="given-name" placeholder="Amara">
            </div>
            <div class="field">
              <label for="sLast">Last name</label>
              <input class="input" id="sLast" autocomplete="family-name" placeholder="Kimani">
            </div>
          </div>
          <div class="field">
            <label for="sEmail">Email address</label>
            <input class="input" id="sEmail" type="email" autocomplete="email" placeholder="you@mail.com">
          </div>
          <div class="field">
            <label for="newPassword">Password</label>
            <div class="input-wrap">
              <input class="input" id="newPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters">
              <button type="button" data-reveal aria-label="Show password">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"></path><circle cx="12" cy="12" r="2.6"></circle></svg>
              </button>
            </div>
            <div class="meter"><i></i><i></i><i></i><i></i></div>
          </div>
          <label class="checkline">
            <input type="checkbox" id="terms">
            <span>I am 18 or older and accept the <a class="link" href="#">Terms</a> and <a class="link" href="responsible.html">Risk Disclosure</a>.</span>
          </label>
          <button class="btn btn-fill" type="submit">Create account</button>
        </form>

        <div class="divider">or</div>

        <button class="btn btn-ghost" type="button" data-splash="Setting up your account with Google">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 01-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/>
            <path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1A12 12 0 0012 24z"/>
            <path fill="#FBBC05" d="M5.4 14.4a7.2 7.2 0 010-4.6V6.7H1.4a12 12 0 000 10.8l4-3.1z"/>
            <path fill="#EA4335" d="M12 4.8c1.8 0 3.4.6 4.6 1.8l3.4-3.4A12 12 0 001.4 6.7l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <div class="auth-foot">Already registered? <a href="login.html">Sign in</a></div>
    </div>
  </main>
</div>
<script src="assets/js/format.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/modals.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
