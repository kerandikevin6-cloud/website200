<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>/* Before the first paint: app.js runs at the end of the body, and until
   it does every page renders in the default light palette and then flips.
   On a multi-page app that flip happens on every single navigation, which
   is the flicker. Four lines here, ahead of the stylesheet, cost nothing
   and remove it. */
try{document.documentElement.setAttribute('data-theme',localStorage.getItem('nexas.theme')||'dark')}
catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
<script>/* Coming back from Google, the session is in the URL and the page under
   it is the sign-in form the customer has just finished with. Marked here,
   in the head, because app.js runs at the end of the body: by the time it
   could hide the form the browser has already painted it, and a flash of
   "sign up" after signing up is the app appearing to have failed. */
try{if(/[?#].*(access_token|[?&]code=|error_code|error_description|[?&#]error=)/.test(location.href))
document.documentElement.setAttribute('data-oauth','');}catch(e){}</script>

<body data-page="chat" data-chrome="app" data-back="account" data-title="Support">
<div class="app">
  <main>
    <div class="shell">
      <div class="chat-head">
        <span class="chat-face" aria-hidden="true"></span>
        <div>
          <b>Lucy &middot; Novi support</b>
          <span>Answers within 30 minutes</span>
        </div>
      </div>

      <!-- A ticket, not a chat window. The chat here used to answer
           itself: a message went into a div, a canned reply came back,
           and nothing ever left the browser. This reaches a person. -->
      <form class="ticket-form" id="ticketForm">
        <div class="field">
          <label for="tCat">What is this about</label>
          <select class="input" id="tCat">
            <option value="deposit">A deposit</option>
            <option value="withdrawal">A withdrawal</option>
            <option value="account">My account or verification</option>
            <option value="trading">Trading and contracts</option>
            <option value="other">Something else</option>
          </select>
        </div>

        <div class="field">
          <label for="tBody">What happened</label>
          <textarea class="input ticket-text" id="tBody" rows="6" maxlength="2000"
            placeholder="Dates, amounts and the number you used help us find it faster."></textarea>
          <span class="hint" id="tCount">10 characters minimum</span>
        </div>

        <button class="btn btn-fill" type="submit" id="tSend">Send to support</button>
      </form>

      <div class="ticket-sect label">Your tickets</div>
      <div id="ticketList"><div class="sk sk-list"></div></div>
      <div style="height:22px"></div>
    </div>
  </main>
</div>

</body>
