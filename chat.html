<script>/* Before the first paint: app.js runs at the end of the body, and until
   it does every page renders in the default light palette and then flips.
   On a multi-page app that flip happens on every single navigation, which
   is the flicker. Four lines here, ahead of the stylesheet, cost nothing
   and remove it. */
try{document.documentElement.setAttribute('data-theme',localStorage.getItem('nexas.theme')||'dark')}
catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
<script>/* Coming back from Google, the session is in the URL and the page under
   it is the sign-in form the customer has just finished with. Marked here,
   in the head, because app.js runs at the end of the body: by the time it
   could hide the form the browser has already painted it, and a flash of
   "sign up" after signing up is the app appearing to have failed. */
try{if(/[?#].*(access_token|[?&]code=|error_code|error_description|[?&#]error=)/.test(location.href))
document.documentElement.setAttribute('data-oauth','');}catch(e){}</script>

<body data-page="chat" data-chrome="app" data-back="account" data-title="Support">
<div class="app">
  <main>
    <div class="shell">
      <!-- No agent card. A photograph and a name at the top of a form
           is a promise about who is reading it, and the answer comes
           back as a ticket rather than as a person typing. The page is
           the record; the asking happens in the dialog, which opens on
           arrival because that is what somebody came here to do. -->
      <div class="page-head">
        <p>Tell us what happened and we will come back within 30 minutes.</p>
      </div>

      <div class="ticket-new">
        <button class="btn btn-fill" type="button" id="tNew">Open a ticket</button>
      </div>

      <div class="ticket-sect label">Your tickets</div>
      <div id="ticketList"><div class="sk sk-list"></div></div>
      <div style="height:22px"></div>
    </div>
  </main>
</div>
