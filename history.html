<script>/* Before the first paint: app.js runs at the end of the body, and until
   it does every page renders in the default light palette and then flips.
   On a multi-page app that flip happens on every single navigation, which
   is the flicker. Four lines here, ahead of the stylesheet, cost nothing
   and remove it. */
try{document.documentElement.setAttribute('data-theme',localStorage.getItem('nexas.theme')||'dark')}
catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>

<body data-page="history" data-chrome="app" data-title="History" data-back="/">
<div class="app">
  <main>
    <div class="shell" id="history">
      <div id="histList"><div class="sk sk-list"></div></div>
      <div style="height:22px"></div>
    </div>
  </main>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/net.js"></script>
<script src="assets/js/format.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/modals.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  "use strict";
  /* Every settled trade, newest first, grouped by day.

     Source of the list, in order of preference:
       the API, when signed in, so the history follows the person
                   between devices instead of living in one browser
       localStorage, otherwise, which is the demo and offline case

     The server is the record, not the referee: contracts still settle in
     the browser, so what is listed is what this account reported. That
     distinction matters enough to be written down here and in
     sql/007_trades.sql, and not to be papered over in the interface. */
  function init() {
    var API = window.NexAPI, F = window.NexFmt;
    var list = document.getElementById('histList');
    if (!list) return;

    var live = !!(window.NexNet && window.NexNet.live && window.NexNet.signedIn());
    var cursor = null, loading = false, exhausted = false;
    var rows = [];

    function dayKey(ts) {
      var d = new Date(ts);
      return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    }
    function dayLabel(ts) {
      var k = dayKey(ts);
      if (k === dayKey(Date.now())) return 'Today';
      if (k === dayKey(Date.now() - 86400000)) return 'Yesterday';
      return F.date(ts);
    }

    /* Both sources end up in one shape, so the renderer never has to ask
       where a row came from. */
    function fromLocal(c) {
      var meta = API.symbol(c.symbol);
      return {
        label: API.contracts.label(c),
        name: c.symbolName || (meta && meta.name) || c.symbol,
        at: c.exitTime || c.entryTime,
        profit: c.profit
      };
    }
    function fromServer(t) {
      var meta = API.symbol(t.symbol);
      return {
        label: API.contracts.label({ type: t.type, side: t.side, barrier: t.barrier }),
        name: t.symbolName || (meta && meta.name) || t.symbol,
        at: new Date(t.settledAt).getTime(),
        profit: (t.profitMinor || 0) / 100
      };
    }

    function skeleton() {
      return '<div class="sk sk-list"></div>';
    }
    function empty() {
      return '<div class="empty" style="padding:56px 20px">' +
        window.NexIcon('clock', 24) +
        '<b>No trades yet</b>' +
        '<span>Settled trades show up here, newest first.</span></div>';
    }
    function failed(message) {
      return '<div class="empty" style="padding:56px 20px">' +
        window.NexIcon('alert', 24) +
        '<b>Could not load your history</b>' +
        '<span>' + (message || 'Try again in a moment.') + '</span>' +
        '<button class="btn-mini" id="histRetry" style="margin-top:14px">Try again</button>' +
        '</div>';
    }

    function render() {
      if (!rows.length) { list.innerHTML = empty(); return; }

      var out = '', lastDay = null;
      rows.forEach(function (r) {
        var k = dayKey(r.at);
        if (k !== lastDay) {
          if (lastDay !== null) out += '</div>';
          out += '<div class="hist-day"><div class="hist-day-label">' + dayLabel(r.at) + '</div>';
          lastDay = k;
        }
        out += '<div class="hist-row">' +
          '<span class="hist-what"><b>' + r.label + '</b>' +
            '<span>' + r.name.replace(' Index', '') + ' · ' + F.clock(r.at) + '</span></span>' +
          '<span class="hist-num num ' + (r.profit >= 0 ? 'pos' : 'neg') + '">' +
            F.signedMoney(r.profit) + '</span>' +
        '</div>';
      });
      if (lastDay !== null) out += '</div>';

      if (!exhausted && live) {
        out += '<div class="hist-more"><button class="btn-mini" id="histMore">' +
          (loading ? 'Loading' : 'Show older') + '</button></div>';
      }
      list.innerHTML = out;

      var more = document.getElementById('histMore');
      if (more) more.addEventListener('click', function () { load(); });
    }

    function renderLocal() {
      rows = API.contracts.closed().slice().sort(function (a, b) {
        return (b.exitTime || b.entryTime) - (a.exitTime || a.entryTime);
      }).map(fromLocal);
      exhausted = true;
      render();
    }

    async function load() {
      if (loading || exhausted) return;
      loading = true;
      if (!rows.length) list.innerHTML = skeleton();
      else render();

      try {
        var out = await window.NexNet.history({ before: cursor, limit: 50 });
        rows = rows.concat(out.trades.map(fromServer));
        cursor = out.nextBefore;
        exhausted = !cursor;
        loading = false;
        render();
      } catch (err) {
        loading = false;
        if (rows.length) { render(); return; }
        list.innerHTML = failed(err && err.message);
        var retry = document.getElementById('histRetry');
        if (retry) retry.addEventListener('click', function () {
          exhausted = false; load();
        });
      }
    }

    API.ready(function () {
      document.body.classList.remove('loading');
      if (live) {
        load();
      } else {
        renderLocal();
        API.on('contracts', renderLocal);
      }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
