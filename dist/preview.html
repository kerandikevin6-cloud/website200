/* ============================================================
   Nexas — positions
   Open contracts, settled history and the cash ledger, with
   filters, a detail sheet and CSV export.
   ============================================================ */
(function () {
  "use strict";

  var API, F, I;
  var view = 'open';
  var filter = { range: 'today', type: 'all' };
  var el = {};

  function within(ts) {
    var d = new Date(); d.setHours(0, 0, 0, 0);
    if (filter.range === 'today') return ts >= d.getTime();
    if (filter.range === '7d') return ts >= Date.now() - 7 * 864e5;
    if (filter.range === '30d') return ts >= Date.now() - 30 * 864e5;
    return true;
  }
  function typeOk(c) {
    if (filter.type === 'all') return true;
    if (filter.type === 'digits') return c.type === 'matches' || c.type === 'differs';
    if (filter.type === 'evenodd') return c.type === 'even_odd';
    return c.type === 'over' || c.type === 'under';
  }

  function rows() {
    if (view === 'open') return API.contracts.open();
    if (view === 'closed') {
      return API.contracts.closed().filter(function (c) { return within(c.exitTime || c.entryTime) && typeOk(c); });
    }
    return API.transactions.list().filter(function (t) { return within(t.t); });
  }

  /* ---------- summary ---------- */
  function renderSummary() {
    var closed = API.contracts.closed().filter(function (c) { return within(c.exitTime || c.entryTime) && typeOk(c); });
    var open = API.contracts.open();
    var pnl = closed.reduce(function (a, c) { return a + c.profit; }, 0);
    var wins = closed.filter(function (c) { return c.profit > 0; }).length;
    var rate = closed.length ? Math.round(wins / closed.length * 100) : 0;
    var staked = closed.reduce(function (a, c) { return a + c.stake; }, 0);

    el.summary.innerHTML =
      '<div class="pnl-head">' +
        '<div><span class="label">Net profit / loss</span>' +
        '<div class="big num ' + (pnl >= 0 ? 'pos' : 'neg') + '">' + F.signed(pnl) + '</div>' +
        '<div class="sub">' + API.account.currency() + ' · ' + labelRange() + '</div></div>' +
        '<div class="pnl-side">' +
          '<div class="kv"><span>Win rate</span><b class="num">' + rate + '%</b></div>' +
          '<div class="kv"><span>Settled</span><b class="num">' + closed.length + '</b></div>' +
          '<div class="kv"><span>Staked</span><b class="num">' + F.amount(staked) + '</b></div>' +
          '<div class="kv"><span>Running</span><b class="num">' + open.length + '</b></div>' +
        '</div>' +
      '</div>';
  }
  function labelRange() {
    return { today: 'today', '7d': 'last 7 days', '30d': 'last 30 days', all: 'all time' }[filter.range];
  }

  /* ---------- filters ---------- */
  function renderFilters() {
    if (view === 'open') { el.filters.innerHTML = ''; return; }
    var ranges = [['today', 'Today'], ['7d', '7 days'], ['30d', '30 days'], ['all', 'All']];
    var types = [['all', 'All types'], ['evenodd', 'Even / Odd'], ['digits', 'Matches / Differs'], ['overunder', 'Over / Under']];

    el.filters.innerHTML =
      '<div class="filters">' +
        '<div class="chipline">' + ranges.map(function (r) {
          return '<button class="fchip' + (filter.range === r[0] ? ' on' : '') + '" data-range="' + r[0] + '">' + r[1] + '</button>';
        }).join('') + '</div>' +
        (view === 'closed'
          ? '<select class="input sm" id="typeFilter" aria-label="Contract type">' + types.map(function (t) {
              return '<option value="' + t[0] + '"' + (filter.type === t[0] ? ' selected' : '') + '>' + t[1] + '</option>';
            }).join('') + '</select>'
          : '') +
        '<button class="btn-mini" id="exportBtn">' + I('down', 14) + 'CSV</button>' +
      '</div>';
  }

  /* ---------- list ---------- */
  function renderList() {
    var data = rows();
    if (!data.length) {
      el.list.innerHTML = '<div class="empty">' +
        I('book', 26) +
        '<b>Nothing here yet</b>' +
        '<span>' + (view === 'open' ? 'Contracts you take will appear here while they run.'
          : view === 'closed' ? 'No settled contracts in this period.'
          : 'No money movements in this period.') + '</span></div>';
      return;
    }

    if (view === 'transactions') {
      el.list.innerHTML = '<div class="list">' + data.map(function (t) {
        return '<div class="trow">' +
          '<span class="ico ' + (t.amount >= 0 ? 'pos' : 'neg') + '">' + I(t.amount >= 0 ? 'up' : 'down', 16) + '</span>' +
          '<span class="t"><b>' + t.kind + (t.ref ? ' · ' + t.ref : '') + '</b>' +
          '<span>' + F.dateTime(t.t) + '</span></span>' +
          '<span class="p"><span class="num ' + (t.amount >= 0 ? 'pos' : 'neg') + '">' + F.signed(t.amount) + '</span>' +
          '<span class="num sub">' + F.amount(t.balance) + '</span></span>' +
        '</div>';
      }).join('') + '</div>';
      return;
    }

    el.list.innerHTML = '<div class="list">' + data.map(function (c) {
      var live = c.status === 'open';
      var pl = live ? c.value - c.stake : c.profit;
      return '<button class="trow" data-detail="' + c.id + '">' +
        '<span class="ico ' + (live ? 'live' : pl >= 0 ? 'pos' : 'neg') + '">' +
          (live ? I('clock', 16) : I(pl >= 0 ? 'check' : 'close', 16)) + '</span>' +
        '<span class="t"><b>' + API.contracts.label(c) + '</b>' +
          '<span>' + c.symbolName.replace(' Index', '') + ' · ' + F.money(c.stake) +

  /* ---------- detail ---------- */
  function detail(id) {
    var c = API.contracts.get(id);

    window.NexModals.detail = {
      steps: {
        main: {
          title: API.contracts.label(c),

          body: function () {
            return '<div class="modal-form">' +
              '<div class="detail-pl ' + (pl >= 0 ? 'pos' : 'neg') + '"><span class="label">' +
                (live ? 'Indicative' : 'Result') + '</span><b class="num">' + F.signedMoney(pl) + '</b></div>' +
              '<div class="totals">' +
                kv('Contract', API.contracts.label(c)) +
                kv('Stake', F.money(c.stake)) +
                kv('Payout if won', F.money(c.payout)) +
                kv('Duration', F.ticks(c.ticks)) +
                kv('Entry spot', F.price(c.entrySpot)) +
                kv('Entry time', F.dateTime(c.entryTime)) +
                (c.exitSpot != null ? kv('Exit spot', F.price(c.exitSpot)) : '') +
                (c.exitTime ? kv('Exit time', F.dateTime(c.exitTime)) : '') +
                kv('Reference', c.id) +
              '</div>' +
              (live
                ? '<button class="btn btn-fill" data-sell-modal="' + c.id + '">Sell for ' + F.money(c.value) + '</button>'
                : '') +
            '</div>';
          }
        }
      }
    };
    window.NexModal.open('detail');
  }
  function kv(k, v) { return '<div class="kv"><span>' + k + '</span><b>' + v + '</b></div>'; }

  /* ---------- export ---------- */
  function csv() {
    var data = rows(), head, lines;
    if (view === 'transactions') {
      head = ['time', 'kind', 'reference', 'amount', 'balance'];
      lines = data.map(function (t) {
        return [new Date(t.t).toISOString(), t.kind, t.ref, t.amount, t.balance];
      });
    } else {
      head = ['id', 'contract', 'symbol', 'stake', 'payout', 'ticks', 'entry', 'exit', 'status', 'profit', 'time'];
      lines = data.map(function (c) {
        return [c.id, API.contracts.label(c), c.symbolName, c.stake, c.payout, c.ticks,
          c.entrySpot, c.exitSpot == null ? '' : c.exitSpot, c.status, c.profit,
          new Date(c.entryTime).toISOString()];
      });
    }
    var text = [head].concat(lines).map(function (r) {
      return r.map(function (x) { return '"' + String(x).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\n');

    /* the hosted preview sandbox blocks downloads; copy instead */
    if (window.NEXAS_BUNDLE) {
      if (navigator.clipboard) navigator.clipboard.writeText(text);
      window.NexToast('CSV copied to the clipboard (' + (data.length) + ' rows)');
      return;
    }
    try {
      var blob = new Blob([text], { type: 'text/csv' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'nexas-' + view + '-' + new Date().toISOString().slice(0, 10) + '.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.NexToast('CSV exported');
    } catch (e) {
      navigator.clipboard && navigator.clipboard.writeText(text);
      window.NexToast('Download blocked here — CSV copied to the clipboard');
    }
  }

  /* ---------- mount ---------- */
  function renderAll() { renderSummary(); renderFilters(); renderList(); }

  function init() {
    API = window.NexAPI; F = window.NexFmt; I = window.NexIcon;

      var tab = e.target.closest('[data-posview]');

        view = tab.getAttribute('data-posview');
        tab.parentElement.querySelectorAll('[data-posview]').forEach(function (b) { b.classList.remove('active'); });
        tab.classList.add('active');
        renderAll();
        return;
      }
      var r = e.target.closest('[data-range]');
      if (r) { filter.range = r.getAttribute('data-range'); renderAll(); return; }
      var d = e.target.closest('[data-detail]');
      if (d) { detail(d.getAttribute('data-detail')); return; }
      if (e.target.closest('#exportBtn')) { csv(); return; }
    });
    root.addEventListener('change', function (e) {
      if (e.target.id === 'typeFilter') { filter.type = e.target.value; renderAll(); }
    });
    document.addEventListener('click', function (e) {
      var s = e.target.closest('[data-sell-modal]');
      if (!s) return;
      var res = API.contracts.sell(s.getAttribute('data-sell-modal'));
      window.NexModal.close();
      window.NexToast(res.ok ? 'Contract sold' : res.error);
    });

    if (window.__nexPosOff) window.__nexPosOff.forEach(function (f) { f(); });
    window.__nexPosOff = [];

    API.ready(function () {
      API.seedDemoHistory();
      document.body.classList.remove('loading');
      renderAll();
      window.__nexPosOff.push(API.on('contracts', renderAll));
      window.__nexPosOff.push(API.on('balance', renderAll));
    });
  }

  window.NexPositions = { init: init };
})();

        '<div class="modal-box">' +
          '<div class="modal-head">' +
            (state.trail.length ? '<button class="iconbtn" data-modal-back aria-label="Back">' + icon('back', 18) + '</button>' : '') +
            '<div><h2>' + title + '</h2>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>' +
            '<button class="iconbtn" data-close aria-label="Close">' + icon('close', 18) + '</button>' +
          '</div>' + step.body(state.data) +
        '</div></div>';

    if (fresh) requestAnimationFrame(function () {
      var m = host().querySelector('.modal');
      if (m) m.classList.add('open');
    });
    var first = host().querySelector('input, select, button:not([data-close])');
    if (first) first.focus();
    var pw = host().querySelector('#newPassword');
    if (pw) paintMeter(pw);
  }
  function closeModals() {
    var m = host().querySelector('.modal');
    if (!m) return;
    m.classList.remove('open');
    var token = ++closeToken;
    setTimeout(function () { if (token === closeToken) host().innerHTML = ''; }, 220);
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  window.NexModal = { open: openModal, close: closeModals, step: gotoStep, data: function () { return state.data; } };

  /* focus trap: modal first, otherwise the open drawer */
  function trap(e) {
    if (e.key !== 'Tab') return;
    var drawerEl = document.getElementById('drawer');
    var box = host().querySelector('.modal-box') ||
      (drawerEl && drawerEl.classList.contains('open') ? drawerEl : null);
    if (!box) return;
    var f = box.querySelectorAll('a[href], button:not([disabled]), input, select, textarea');
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  /* ---------- toast ---------- */
  var toastEl;
  window.NexToast = function (msg) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'toast';
      toastEl.setAttribute('role', 'status');
      toastEl.setAttribute('aria-live', 'polite');
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add('open');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.classList.remove('open'); }, 2600);
  };

  /* ---------- connection banner ---------- */
  function connectionBanner() {
    var b = document.getElementById('connBanner');
    if (!b) {
      b = document.createElement('div');
      b.id = 'connBanner';
      b.className = 'conn-banner';
      b.setAttribute('role', 'status');
      document.body.appendChild(b);
    }
    var st = API.connection.status();
    b.className = 'conn-banner' + (st === 'live' ? '' : ' show');
    b.innerHTML = st === 'live' ? '' : '<span class="spin"></span>' +
      (st === 'reconnecting' ? 'Reconnecting to the price feed' : 'Connecting');
    document.body.classList.toggle('feed-down', st !== 'live');
  }

  /* ---------- consent + risk ---------- */
  function consentBar() {
    if (API.prefs.consent()) return;
    var c = document.createElement('div');
    c.className = 'consent';
    c.innerHTML = '<p>We use essential cookies to keep you signed in. Nothing is shared with advertisers.</p>' +
      '<div class="consent-btns">' +
        '<button class="btn-mini" data-consent="essential">Essential only</button>' +
        '<button class="btn-mini solid" data-consent="all">Accept</button>' +
      '</div>';
    document.body.appendChild(c);
  }
  function riskStrip() {
    if (document.body.getAttribute('data-chrome') !== 'app') return;
    if (API.prefs.riskAck()) return;
    var main = document.querySelector('main');
    if (!main) return;
    var r = document.createElement('div');
    r.className = 'risk-strip';
    r.id = 'riskStrip';
    r.innerHTML = '<span>' + icon('shield', 15) + 'Trading synthetic indices carries risk. You can lose your full stake.</span>' +
      '<button class="iconbtn" id="riskClose" aria-label="Dismiss">' + icon('close', 15) + '</button>';
    main.insertBefore(r, main.firstChild);
  }

  /* ---------- sign-in transition ---------- */
  function splash(message, to) {
    var el = document.createElement('div');
    el.className = 'splash';
    el.innerHTML = '<div class="splash-inner">' +
      '<div class="pulse"><i></i><i></i><i></i></div>' +
      '<div class="splash-word">Nexas</div>' +
      '<div class="splash-msg" role="status">' + message + '</div></div>';
    document.body.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('open'); });
    setTimeout(function () {
      if (BUNDLE) { go(to); el.remove(); } else location.href = to;
    }, 1600);
  }
  window.NexSplash = splash;

  /* ---------- session guard ---------- */
  function guard() {
    if (document.body.getAttribute('data-chrome') !== 'app') return true;
    if (API.session.get()) return true;
    go('login.html');
    return false;
  }

  /* ---------- password meter ---------- */
  function paintMeter(input) {
    var v = input.value, score = 0;
    if (v.length >= 8) score++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
    if (/\d/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    var wrap = input.closest('.field') || document;
    wrap.querySelectorAll('.meter i').forEach(function (bar, i) { bar.classList.toggle('on', i < score); });
  }

  /* ---------- chrome mount ---------- */
  function mountChrome(root) {
    var chrome = document.body.getAttribute('data-chrome');
    host();
    if (chrome === 'auth' || chrome === 'plain') return;
    var page = currentPage();
    var sub = !!document.body.getAttribute('data-back');
    if (sub) document.body.classList.add('no-tabs');
    root.insertAdjacentHTML('afterbegin', topbar(page));
    root.insertAdjacentHTML('beforeend', drawer() + (sub ? '' : tabbar(page)));
  }

  function setDrawer(open) {
    var d = document.getElementById('drawer'), s = document.getElementById('scrim');
    if (!d) return;
    d.classList.toggle('open', open);
    s.classList.toggle('open', open);
    document.body.classList.toggle('locked', open);
  }

  /* ---------- global events ---------- */
  function wire() {
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (!t || !t.closest) return;

      if (t.closest('#menuBtn')) { setDrawer(true); return; }
      if (t.closest('#scrim')) { setDrawer(false); return; }

      var themeBtn = t.closest('.theme-toggle');
      if (themeBtn) {
        e.preventDefault();
        applyTheme(isDark() ? 'light' : 'dark');
        var ic = themeBtn.querySelector('svg');
        if (ic) ic.outerHTML = icon(isDark() ? 'moon' : 'sun', 17);
        return;
      }

      var grp = t.closest('.dgroup-head');
      if (grp) {
        var opened = grp.parentElement.classList.toggle('open');
        grp.setAttribute('aria-expanded', String(opened));
        return;
      }

      if (t.closest('#signOut')) { API.session.signOut(); splash('Signing you out', 'login.html'); return; }

      var consent = t.closest('[data-consent]');
      if (consent) {
        API.prefs.setConsent(true);
        var bar = consent.closest('.consent');
        if (bar) bar.remove();
        return;
      }
      if (t.closest('#riskClose')) {
        API.prefs.setRiskAck(true);
        var strip = document.getElementById('riskStrip');
        if (strip) strip.remove();
        return;
      }

      var sp = t.closest('[data-splash]');
      if (sp && sp.tagName !== 'FORM') {
        e.preventDefault();
        API.session.signIn(null, 'google');
        splash(sp.getAttribute('data-splash'), sp.getAttribute('data-to') || 'index.html');
        return;
      }

      var mod = t.closest('[data-open]');
      if (mod) { e.preventDefault(); setDrawer(false); openModal(mod.getAttribute('data-open')); return; }

      if (t.closest('[data-close]')) { closeModals(); return; }
      if (t.closest('[data-modal-back]')) { backStep(); return; }

      var setter = t.closest('[data-set]');
      if (setter) {
        var pair = setter.getAttribute('data-set').split(':');
        state.data[pair[0]] = pair[1];
      }
      var step = t.closest('[data-goto]');
      if (step) { gotoStep(step.getAttribute('data-goto')); return; }

      var action = t.closest('[data-action]');
      if (action) { runAction(action.getAttribute('data-action'), action); return; }

      var done = t.closest('[data-done]');
      if (done) { closeModals(); window.NexToast(done.getAttribute('data-done')); return; }

      if (t.closest('[data-copy]')) { window.NexToast('Address copied'); return; }

      var amt = t.closest('[data-amount]');
      if (amt) {
        var box = amt.closest('.field').querySelector('input');
        box.value = amt.getAttribute('data-amount');
        box.dispatchEvent(new Event('input', { bubbles: true }));
        return;
      }

      var reveal = t.closest('[data-reveal]');
      if (reveal) {
        var inp = reveal.parentElement.querySelector('input');
        inp.type = inp.type === 'password' ? 'text' : 'password';
        return;
      }

      var seg = t.closest('.seg button, .ctabs .ctab');
      if (seg && !seg.hasAttribute('data-tab') && !seg.hasAttribute('data-mode') && !seg.hasAttribute('data-posview')) {
        var parent = seg.parentElement;
        parent.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
        seg.classList.add('active');
      }
    });

    document.addEventListener('input', function (e) {
      var el = e.target;
      if (el.id === 'newPassword') paintMeter(el);
      var total = document.querySelector('[data-total="' + el.id + '"]');
      if (total) {
        var fee = +(total.getAttribute('data-fee') || 0);
        total.textContent = F.money(Math.max(0, (+el.value || 0) - fee));
      }
    });

    document.addEventListener('submit', function (e) {
      var f = e.target;
      if (!f.hasAttribute) return;
      if (f.hasAttribute('data-splash')) {
        e.preventDefault();
        var email = f.querySelector('input[type=email]');
        API.session.signIn(email && email.value, 'password');
        splash(f.getAttribute('data-splash'), f.getAttribute('data-to') || 'index.html');
        return;
      }
      if (f.hasAttribute('data-demo-form')) {
        e.preventDefault();
        window.NexToast(f.getAttribute('data-demo-form'));
      }
    });

    document.addEventListener('keydown', function (e) {
      trap(e);
      if (e.key === 'Escape') { closeModals(); setDrawer(false); }
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'd') openModal('deposit');
      if (e.key === '?') openModal('shortcuts');
    });
  }

  /* actions that touch money or verification */
  function runAction(name, node) {
    if (name === 'deposit') {
      var amount = +((document.getElementById('amount') || {}).value) || 0;
      if (amount <= 0) return window.NexToast('Enter an amount to deposit');
      API.account.credit(amount, 'Deposit');
      closeModals();
      window.NexToast('Deposited ' + F.money(amount));
      return;
    }
    if (name === 'withdraw') {
      if (!API.kyc.verified()) { gotoStep('kyc'); return; }
      var w = +((document.getElementById('wAmount') || {}).value) || 0;
      if (w <= 0) return window.NexToast('Enter an amount to withdraw');
      if (w > API.account.balance()) return window.NexToast('Not enough funds');
      API.account.debit(w, 'Withdrawal');
      closeModals();
      window.NexToast('Withdrawal of ' + F.money(w) + ' submitted');
      return;
    }
    if (name === 'verify') {
      API.kyc.submit();
      closeModals();
      window.NexToast('Identity submitted — usually cleared within the hour');
      return;
    }
    if (name === 'useAccount') {
      var kind = node.getAttribute('data-kind');
      API.account.use(kind);
      closeModals();
      window.NexToast('Switched to the ' + kind + ' account');
      return;
    }
    if (name === 'saveAuto') {
      API.prefs.setAuto({
        runs: +document.getElementById('autoRuns').value || 10,
        multiplier: +document.getElementById('autoMult').value || 2,
        takeProfit: +document.getElementById('autoTP').value || 200,
        stopLoss: +document.getElementById('autoSL').value || 100
      });
      closeModals();
      window.NexToast('Run settings saved');
      return;
    }
  }

  /* ---------- live chrome updates ---------- */
  function bindChrome() {
    API.on('balance', function () {
      var b = document.getElementById('acctBtn');
      if (b) b.innerHTML = balanceMarkup();
    });
    API.on('connection', connectionBanner);
    connectionBanner();
  }

  /* ---------- chat ---------- */
  function initChat() {
    var log = document.getElementById('chatLog');
    if (!log) return;
    var form = document.getElementById('chatForm'), input = document.getElementById('chatInput');
    function add(text, who) {
      var m = document.createElement('div');
      m.className = 'msg ' + who;
      m.innerHTML = text.replace(/</g, '&lt;') + '<span class="time">' + F.clock(Date.now()) + '</span>';
      log.appendChild(m);
      log.scrollTop = log.scrollHeight;
    }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = input.value.trim();
      if (!v) return;
      add(v, 'me');
      input.value = '';
      setTimeout(function () { add('Thanks — checking that for you now. One moment.', 'them'); }, 900);
    });
    log.scrollTop = log.scrollHeight;
  }

  /* ---------- markets ---------- */
  function initMarkets() {
    var listHost = document.getElementById('marketList');
    if (!listHost) return;
    function render() {
      listHost.innerHTML = '<div class="list">' + API.symbols.map(function (s) {
        var h = API.feed.history(s.id);
        var last = h[h.length - 1], first = h[Math.max(0, h.length - 60)];
        var chg = (last.price - first.price) / first.price * 100;
        return '<a class="mkt" href="' + href('index.html') + '">' +
          '<span class="inst-mark">' + icon('chart', 14) + '</span>' +
          '<span class="n"><b>' + s.name + '</b><span>' + s.group + '</span></span>' +
          '<span class="p"><span class="num">' + F.price(last.price, s.digits) + '</span>' +
          '<span class="num ' + (chg >= 0 ? 'pos' : 'neg') + '">' + F.signedPct(chg) + '</span></span></a>';
      }).join('') + '</div>';
    }
    API.ready(function () {
      document.body.classList.remove('loading');
      render();
      clearInterval(window.__nexMkt);
      window.__nexMkt = setInterval(render, 2000);
    });
  }

  /* ---------- boot ---------- */
  function boot() {
    API = window.NexAPI; F = window.NexFmt;
    clearInterval(window.__nexMkt);
    if (!guard()) return;
    document.body.classList.add('loading');
    mountChrome(document.querySelector('.app') || document.body);
    if (!window.__nexWired) { wire(); window.__nexWired = true; }
    bindChrome();
    consentBar();
    riskStrip();
    initChat();
    initMarkets();
    if (window.NexTrade) window.NexTrade.init();
    if (window.NexPositions) window.NexPositions.init();
    if (document.body.getAttribute('data-chrome') !== 'app') document.body.classList.remove('loading');
    if (document.querySelector('.trade-dock')) document.body.classList.add('has-sticky');
  }
  window.NexBoot = boot;

  if (!BUNDLE) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  }
})();

</script>
<script>
(function () {
  var app = document.getElementById('app');

  function route() {
    var name = (location.hash || '#/index').replace('#/', '').split('?')[0] || 'index';
    var page = window.NEXAS_PAGES[name] || window.NEXAS_PAGES.index;

    document.body.className = '';
    Object.keys(page.attrs).forEach(function (k) { document.body.setAttribute(k, page.attrs[k]); });
    ['data-back', 'data-title'].forEach(function (k) {
      if (!page.attrs[k]) document.body.removeAttribute(k);
    });

    app.innerHTML = '<main>' + page.html + '</main>';
    window.NexBoot();
    if (page.script) { try { new Function(page.script)(); } catch (e) {} }
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href');
    if (!href || href.indexOf('.html') === -1) return;
    e.preventDefault();
    location.hash = '#/' + href.replace('.html', '');
  });

  window.addEventListener('hashchange', route);
  route();
})();
</script>
