<script>/* Before the first paint: app.js runs at the end of the body, and until
   it does every page renders in the default light palette and then flips.
   On a multi-page app that flip happens on every single navigation, which
   is the flicker. Four lines here, ahead of the stylesheet, cost nothing
   and remove it. */
try{document.documentElement.setAttribute('data-theme',localStorage.getItem('nexas.theme')||'dark')}
catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
<script>/* Coming back from Google, the session is in the URL and the page under
   it is the sign-in form the customer has just finished with. Marked here,
   in the head, because app.js runs at the end of the body: by the time it
   could hide the form the browser has already painted it, and a flash of
   "sign up" after signing up is the app appearing to have failed. */
try{if(/[?#].*(access_token|[?&]code=|error_code|error_description|[?&#]error=)/.test(location.href))
document.documentElement.setAttribute('data-oauth','');}catch(e){}</script>

<body data-page="login" data-chrome="auth">
<div class="app">
  <main>
    <div class="auth">
      <div class="auth-head">
        <a class="iconbtn back-btn auth-back" href="landing" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 18l-6-6 6-6"></path></svg></a>
        <a class="wordmark" href="/" aria-label="Novi Binary"><span class="wm-name" aria-hidden="true"><b>Novi</b><i>Binary</i></span></a>
        <h1>Welcome back.</h1>
        <p>Sign in to pick up where you left off.</p>
      </div>

      <div class="auth-card">
        <form data-splash="Signing you in" data-auth="login" style="display:flex;flex-direction:column;gap:16px">
          <div class="field">
            <label for="email">Email address</label>
            <input class="input" id="email" type="email" autocomplete="email" placeholder="you@mail.com">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input class="input" id="password" type="password" autocomplete="current-password" placeholder="••••••••">
              <button type="button" data-reveal aria-label="Show password">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"></path><circle cx="12" cy="12" r="2.6"></circle></svg>
              </button>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <label class="checkline" style="font-size:12.5px"><input type="checkbox" id="remember"> Keep me signed in</label>
              <a class="link" href="forgot-password">Forgot password?</a>
            </div>
          </div>
          <button class="btn btn-fill" type="submit">Sign in</button>
        </form>

        <div class="divider">or</div>

        <button class="btn btn-ghost" type="button" data-splash="Signing you in with Google">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 01-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/>
            <path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1A12 12 0 0012 24z"/>
            <path fill="#FBBC05" d="M5.4 14.4a7.2 7.2 0 010-4.6V6.7H1.4a12 12 0 000 10.8l4-3.1z"/>
            <path fill="#EA4335" d="M12 4.8c1.8 0 3.4.6 4.6 1.8l3.4-3.4A12 12 0 001.4 6.7l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <div class="auth-foot">New to Novi? <a href="signup">Create an account</a></div>
    </div>
  </main>
</div>
