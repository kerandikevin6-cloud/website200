<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexas — Forgot Password</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="login" data-chrome="auth">
<div class="app">
  <main>
    <div class="auth">
      <div class="auth-head">
        <a class="wordmark" href="login.html">Nexas</a>
        <h1>Reset your password.</h1>
        <p>Enter the email on your account and we will send a six-digit code.</p>
      </div>

      <div class="auth-card">
        <form data-splash="Sending your reset link" data-auth="forgot" data-to="login.html" style="display:flex;flex-direction:column;gap:16px">
          <div class="field">
            <label for="resetEmail">Email address</label>
            <input class="input" id="resetEmail" type="email" autocomplete="email" placeholder="you@mail.com">
          </div>
          <a class="btn btn-fill" href="reset-password.html">Send reset code</a>
        </form>

        <div class="divider">still stuck?</div>

        <a class="btn btn-ghost" href="chat.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H8l-5 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path></svg>
          Chat with support
        </a>
      </div>

      <div class="auth-foot">Remembered it? <a href="login.html">Back to sign in</a></div>
    </div>
  </main>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/net.js"></script>
<script src="assets/js/format.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/modals.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
