<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>/* Before the first paint: app.js runs at the end of the body, and until
   it does every page renders in the default light palette and then flips.
   On a multi-page app that flip happens on every single navigation, which
   is the flicker. Four lines here, ahead of the stylesheet, cost nothing
   and remove it. */
try{document.documentElement.setAttribute('data-theme',localStorage.getItem('nexas.theme')||'dark')}
catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
<title>Nexas — Positions</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="positions" data-chrome="app">
<div class="app">
  <main>
    <div class="shell" id="positions">
      <div class="page-head">
        <h1>Positions</h1>
        <p>Everything open, settled and paid, on this account.</p>
      </div>

      <div class="ctabs">
        <button class="ctab active" data-posview="open">Open</button>
        <button class="ctab" data-posview="closed">Closed</button>
        <button class="ctab" data-posview="transactions">Ledger</button>
      </div>

      <div id="posSummary"><div class="sk sk-summary"></div></div>
      <div id="posFilters"></div>
      <div id="posList"><div class="sk sk-list"></div></div>
      <div style="height:22px"></div>
    </div>
  </main>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/net.js"></script>
<script src="assets/js/format.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/modals.js"></script>
<script src="assets/js/positions.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
